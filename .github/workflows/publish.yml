# Build, publish and deploy to MonsterASP.NET via FTP
name: Build, publish and deploy to MonsterASP.NET

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Oqtane.slnx

      - name: Publish Oqtane.Server
        run: dotnet publish ./Oqtane.Server/Oqtane.Server.csproj --configuration Release --output ./publish

      - name: Create app_offline.htm
        run: |
          cat > ./publish/app_offline.htm << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>Deployment in Progress</title></head>
          <body>
            <h1>Site Update in Progress</h1>
            <p>The site is being updated. Please check back in a few minutes.</p>
          </body>
          </html>
          EOF

      - name: Upload app_offline.htm to take site offline
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -u "${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }}" \
               -e "set ftp:ssl-allow no; put -O /wwwroot/ ./publish/app_offline.htm; bye" \
               ftp://${{ secrets.SFTP_SERVER }}:21

      - name: Wait for IIS to unload application
        run: sleep 15

      - name: Deploy to MonsterASP.NET via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_SERVER }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: /wwwroot/

      - name: Force-upload appsettings.json and bring site back online
        if: always()
        run: |
          lftp -u "${{ secrets.SFTP_USERNAME }},${{ secrets.SFTP_PASSWORD }}" \
               -e "set ftp:ssl-allow no; \
                   put -O /wwwroot/ ./publish/appsettings.json; \
                   rm -f /wwwroot/app_offline.htm; \
                   bye" \
               "ftp://${{ secrets.SFTP_SERVER }}:21"

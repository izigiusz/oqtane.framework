name: Build, publish and deploy to MonsterASP.NET
on: [push]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0
          
      - name: Install dependencies
        run: dotnet restore Oqtane.sln
        
      - name: Build
        run: dotnet publish ./Oqtane.Database.MySQL/Oqtane.Database.MySQL.csproj --configuration Release  --output ./publish  
      - name: Build2
        run: dotnet publish ./Oqtane.Database.PostgreSQL/Oqtane.Database.PostgreSQL.csproj --configuration Release  --output ./publish 
      - name: Build3
        run: dotnet publish ./Oqtane.Database.Sqlite/Oqtane.Database.Sqlite.csproj --configuration Release  --output ./publish 
      - name: Build4
        run: dotnet publish ./Oqtane.Database.SqlServer/Oqtane.Database.SqlServer.csproj --configuration Release --output ./publish 

      - name: Publish
        run: dotnet publish ./Oqtane.Server/Oqtane.Server.csproj --configuration Release --output ./publish 
        

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
